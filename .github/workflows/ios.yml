name: Combined Mobile CI (Android & iOS)


on:
  push:
    branches: [ testrail2 ] 
  pull_request:
    branches: [ testrail2 ] 
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to run tests against'
        required: true
        default: 'uat'
        type: choice
        options:
          - uat
          - prod

env:
  ENVIRONMENT: ${{ github.event.inputs.environment || 'uat' }}

permissions:
  contents: write

jobs:
  #--------------------------------------
  # JOB 1: RUN ANDROID TESTS
  #--------------------------------------
  run-android-tests:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: 2. Set up JDK 24
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '24'

      - name: 3. Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 4. Install dependencies
        run: npm install

      - name: 5. Set timezone to Asia/Kolkata
        run: |
          export TZ=Asia/Kolkata
          echo "TZ=Asia/Kolkata" >> $GITHUB_ENV
          echo "Current time: $(date '+%Y-%m-%d %H:%M:%S')"

      - name: 6. Run WebDriverIO tests with emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          # Enable hardware acceleration for better performance
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: |
            adb install apk/verto.apk
            echo "Starting Android tests with parallel execution..."
            npx wdio run ./wdio.conf.js
        continue-on-error: true

      - name: 7. Upload Android Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-android
          path: allure-results-android
          retention-days: 1

  #--------------------------------------
  # JOB 2: RUN IOS TESTS
  #--------------------------------------
  run-ios-tests:
    runs-on: macos-latest
    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 3. Install NPM Dependencies
        run: npm install

      - name: 4. Set timezone to Asia/Kolkata
        run: |
          export TZ=Asia/Kolkata
          echo "TZ=Asia/Kolkata" >> $GITHUB_ENV
          echo "Current time: $(date '+%Y-%m-%d %H:%M:%S')"

      - name: 5. Unzip Demo App
        run: unzip ./ios/TheApp.app.zip -d ./ios/

      - name: 6. Run WDIO Tests
        run: npx wdio run ./wdio.ios.conf.js
        continue-on-error: true

      - name: 7. Upload iOS Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-ios
          path: allure-results-ios
          retention-days: 1

  #--------------------------------------
  # JOB 3: GENERATE REPORTS AND TRIGGER CODEBUILD
  #--------------------------------------
  generate-reports-and-trigger-codebuild:
    needs: [run-android-tests, run-ios-tests]
    if: always() 
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Download Android Artifacts
        uses: actions/download-artifact@v4
        with:
          name: allure-results-android
          path: ./allure-results-android
        continue-on-error: true

      - name: 3. Download iOS Artifacts
        uses: actions/download-artifact@v4
        with:
          name: allure-results-ios
          path: ./allure-results-ios
        continue-on-error: true


      - name: 4. Install Allure
        run: npm install -g allure-commandline

      - name: 5. Generate Timestamp
        id: timestamp
        run: |
          export TZ=Asia/Kolkata
          TIMESTAMP=$(date '+%Y-%m-%d-%H-%M-%S')
          echo "TIMESTAMP=$TIMESTAMP" >> $GITHUB_ENV
          echo "timestamp=$TIMESTAMP" >> $GITHUB_OUTPUT
          echo "Generated timestamp: $TIMESTAMP"

      - name: 6. Generate Android Allure Report
        if: hashFiles('./allure-results-android/**/*') != ''
        run: |
          mkdir -p ./allure-report-android
          allure generate ./allure-results-android --clean -o ./allure-report-android
          allure generate ./allure-results-android --clean --single-file -o ./allure-report-android-singlefile
          
          # Save Android test stats
          if [ -f "./allure-report-android/widgets/summary.json" ]; then
            echo "ANDROID_TOTAL=$(jq -r '.statistic.total' ./allure-report-android/widgets/summary.json)" >> $GITHUB_ENV
            echo "ANDROID_PASSED=$(jq -r '.statistic.passed' ./allure-report-android/widgets/summary.json)" >> $GITHUB_ENV
            echo "ANDROID_FAILED=$(jq -r '.statistic.failed' ./allure-report-android/widgets/summary.json)" >> $GITHUB_ENV
            echo "ANDROID_SKIPPED=$(jq -r '.statistic.skipped' ./allure-report-android/widgets/summary.json)" >> $GITHUB_ENV
          else
            echo "ANDROID_TOTAL=0" >> $GITHUB_ENV
            echo "ANDROID_PASSED=0" >> $GITHUB_ENV
            echo "ANDROID_FAILED=0" >> $GITHUB_ENV
            echo "ANDROID_SKIPPED=0" >> $GITHUB_ENV
          fi

      - name: 7. Generate iOS Allure Report
        if: hashFiles('./allure-results-ios/**/*') != ''
        run: |
          mkdir -p ./allure-report-ios
          allure generate ./allure-results-ios --clean -o ./allure-report-ios
          allure generate ./allure-results-ios --clean --single-file -o ./allure-report-ios-singlefile
          
          # Save iOS test stats
          if [ -f "./allure-report-ios/widgets/summary.json" ]; then
            echo "IOS_TOTAL=$(jq -r '.statistic.total' ./allure-report-ios/widgets/summary.json)" >> $GITHUB_ENV
            echo "IOS_PASSED=$(jq -r '.statistic.passed' ./allure-report-ios/widgets/summary.json)" >> $GITHUB_ENV
            echo "IOS_FAILED=$(jq -r '.statistic.failed' ./allure-report-ios/widgets/summary.json)" >> $GITHUB_ENV
            echo "IOS_SKIPPED=$(jq -r '.statistic.skipped' ./allure-report-ios/widgets/summary.json)" >> $GITHUB_ENV
          else
            echo "IOS_TOTAL=0" >> $GITHUB_ENV
            echo "IOS_PASSED=0" >> $GITHUB_ENV
            echo "IOS_FAILED=0" >> $GITHUB_ENV
            echo "IOS_SKIPPED=0" >> $GITHUB_ENV
          fi

      - name: 8. Create metadata file
        run: |
          cat > metadata.json <<EOF
          {
            "timestamp": "${{ env.TIMESTAMP }}",
            "environment": "${{ env.ENVIRONMENT }}",
            "branch": "${{ github.ref_name }}",
            "commit": "${{ github.sha }}",
            "triggered_by": "${{ github.actor }}",
            "run_id": "${{ github.run_id }}",
            "android": {
              "total": "${{ env.ANDROID_TOTAL }}",
              "passed": "${{ env.ANDROID_PASSED }}",
              "failed": "${{ env.ANDROID_FAILED }}",
              "skipped": "${{ env.ANDROID_SKIPPED }}"
            },
            "ios": {
              "total": "${{ env.IOS_TOTAL }}",
              "passed": "${{ env.IOS_PASSED }}",
              "failed": "${{ env.IOS_FAILED }}",
              "skipped": "${{ env.IOS_SKIPPED }}"
            }
          }
          EOF
          
          echo "Metadata created:"
          cat metadata.json

      - name: 9. Commit and push reports to repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Use GitHub token for authentication
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          
          # Fetch to check if branch exists
          git fetch origin reports-staging 2>/dev/null || true
          
          # Create orphan branch (fresh start, no history)
          git checkout --orphan reports-staging-temp
          
          # Remove all tracked files
          git rm -rf . 2>/dev/null || true
          
          # Create directory structure
          mkdir -p reports/latest
          
          # Move reports and metadata
          if [ -d "./allure-report-android" ]; then
            cp -r ./allure-report-android reports/latest/android
            echo "✅ Android reports copied"
          fi
          
          if [ -d "./allure-report-ios" ]; then
            cp -r ./allure-report-ios reports/latest/ios
            echo "✅ iOS reports copied"
          fi

          # Move single reports
          if [ -d "./allure-report-android-singlefile" ]; then
            cp -r ./allure-report-android-singlefile reports/latest/android-singlefile
            echo "✅ Android single-file reports copied"
          fi
          
          if [ -d "./allure-report-ios-singlefile" ]; then
            cp -r ./allure-report-ios-singlefile reports/latest/ios-singlefile
            echo "✅ iOS single-file reports copied"
          fi

          cp metadata.json reports/latest/
          echo "✅ Metadata copied"
          
          # IMPORTANT: Copy buildspec.yml to root for CodeBuild
          git checkout ${{ github.ref_name }} -- buildspec.yml
          echo "✅ buildspec.yml copied from source branch"

          # IMPORTANT: Copy notification.py to root for CodeBuild
          git checkout ${{ github.ref_name }} -- notification.py
          echo "✅ notification.py copied from source branch"

          # Add and commit
          git add reports/latest
          git add buildspec.yml
          git add notification.py
          git commit -m "Test reports for ${{ env.TIMESTAMP }} [skip ci]"
          
          # Delete old reports-staging branch and push new one
          git branch -D reports-staging 2>/dev/null || true
          git branch -m reports-staging
          git push --force origin reports-staging
          
          echo "✅ Reports pushed to reports-staging branch (with buildspec.yml)"
          echo "✅ Reports pushed to reports-staging branch (with notification.py)"

      - name: 10. Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_NON_PROD_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_NON_PROD_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_CODEBUILD_REGION }}

      - name: 11. Trigger CodeBuild for S3 Deployment
        run: |
          echo "🚀 Triggering CodeBuild project: appium-test-suite"
          echo "Region: ${{ secrets.AWS_CODEBUILD_REGION || 'eu-central-1' }}"
          
          # Build environment variables JSON
          ENV_VARS='[
            {"name":"TIMESTAMP","value":"${{ env.TIMESTAMP }}","type":"PLAINTEXT"},
            {"name":"ENV","value":"${{ env.ENVIRONMENT }}","type":"PLAINTEXT"},
            {"name":"GITHUB_REPOSITORY","value":"${{ github.repository }}","type":"PLAINTEXT"},
            {"name":"ANDROID_TOTAL","value":"${{ env.ANDROID_TOTAL }}","type":"PLAINTEXT"},
            {"name":"ANDROID_PASSED","value":"${{ env.ANDROID_PASSED }}","type":"PLAINTEXT"},
            {"name":"ANDROID_FAILED","value":"${{ env.ANDROID_FAILED }}","type":"PLAINTEXT"},
            {"name":"ANDROID_SKIPPED","value":"${{ env.ANDROID_SKIPPED }}","type":"PLAINTEXT"},
            {"name":"IOS_TOTAL","value":"${{ env.IOS_TOTAL }}","type":"PLAINTEXT"},
            {"name":"IOS_PASSED","value":"${{ env.IOS_PASSED }}","type":"PLAINTEXT"},
            {"name":"IOS_FAILED","value":"${{ env.IOS_FAILED }}","type":"PLAINTEXT"},
            {"name":"IOS_SKIPPED","value":"${{ env.IOS_SKIPPED }}","type":"PLAINTEXT"},
            {"name":"GITHUB_ACTOR","value":"${{ github.actor }}","type":"PLAINTEXT"},
            {"name":"GITHUB_REF_NAME","value":"${{ github.ref_name }}","type":"PLAINTEXT"}
          ]'
          
          echo "Environment variables prepared:"
          echo "$ENV_VARS" | jq .
          
          # Start CodeBuild
          BUILD_OUTPUT=$(aws codebuild start-build \
            --project-name appium-test-suite \
            --environment-variables-override "$ENV_VARS" \
            --region ${{ secrets.AWS_CODEBUILD_REGION || 'eu-central-1' }} \
            --output json)
          
          BUILD_ID=$(echo "$BUILD_OUTPUT" | jq -r '.build.id')
          BUILD_STATUS=$(echo "$BUILD_OUTPUT" | jq -r '.build.buildStatus')
          
          echo "✅ CodeBuild started successfully!"
          echo "Build ID: $BUILD_ID"
          echo "Initial Status: $BUILD_STATUS"
          echo "BUILD_ID=$BUILD_ID" >> $GITHUB_ENV
          
          # Generate console URL
          REGION="${{ secrets.AWS_CODEBUILD_REGION || 'eu-central-1' }}"
          CONSOLE_URL="https://$REGION.console.aws.amazon.com/codesuite/codebuild/projects/appium-test-suite/build/$BUILD_ID"
          echo "🔗 View build in AWS Console:"
          echo "$CONSOLE_URL"
          echo "CODEBUILD_URL=$CONSOLE_URL" >> $GITHUB_ENV

      - name: 12. Summary
        if: always()
        run: |
          echo "## 📱 Mobile Test Execution Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Test Results Generated" >> $GITHUB_STEP_SUMMARY
          echo "- **Timestamp**: ${{ env.TIMESTAMP }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment**: ${{ env.ENVIRONMENT }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🤖 Android Results" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Passed: ${{ env.ANDROID_PASSED }}" >> $GITHUB_STEP_SUMMARY
          echo "- ❌ Failed: ${{ env.ANDROID_FAILED }}" >> $GITHUB_STEP_SUMMARY
          echo "- ⏭️ Skipped: ${{ env.ANDROID_SKIPPED }}" >> $GITHUB_STEP_SUMMARY
          echo "- 📊 Total: ${{ env.ANDROID_TOTAL }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🍎 iOS Results" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Passed: ${{ env.IOS_PASSED }}" >> $GITHUB_STEP_SUMMARY
          echo "- ❌ Failed: ${{ env.IOS_FAILED }}" >> $GITHUB_STEP_SUMMARY
          echo "- ⏭️ Skipped: ${{ env.IOS_SKIPPED }}" >> $GITHUB_STEP_SUMMARY
          echo "- 📊 Total: ${{ env.IOS_TOTAL }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📦 Reports committed to \`reports-staging\` branch" >> $GITHUB_STEP_SUMMARY
          echo "🚀 CodeBuild deployment triggered for S3 upload and Slack notification" >> $GITHUB_STEP_SUMMARY