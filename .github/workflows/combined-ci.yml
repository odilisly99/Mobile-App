name: Combined Mobile CI (Android & iOS)

on:
  push:
    branches: [ testrailiyryryntegration ] 
  pull_request:
    branches: [ testrailieeuueuentegration ] 
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to run tests against'
        required: true
        default: 'uat'
        type: choice
        options:
          - uat
          - prod

env:
  ENVIRONMENT: ${{ github.event.inputs.environment || 'uat' }}

permissions:
  contents: read

jobs:
  #--------------------------------------
  # JOB 1: RUN ANDROID TESTS
  #--------------------------------------
  run-android-tests:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: 2. Set up JDK 24
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '24'

      - name: 3. Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 4. Install dependencies
        run: npm install

      - name: 5. Set timezone to Asia/Kolkata
        run: |
          export TZ=Asia/Kolkata
          echo "TZ=Asia/Kolkata" >> $GITHUB_ENV
          echo "Current time: $(date '+%Y-%m-%d %H:%M:%S')"

      # - name: 6. Run WebDriverIO tests with emulator
      #   uses: reactivecircus/android-emulator-runner@v2
      #   with:
      #     api-level: 29
      #     script: |
      #       adb install apk/verto.apk
      #       echo "Starting Android tests..."
      #       npx wdio run ./wdio.conf.js
      #   continue-on-error: true

      - name: 7. Upload Android Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-android
          path: allure-results-android
          retention-days: 1

  #--------------------------------------
  # JOB 2: RUN IOS TESTS
  #--------------------------------------
  run-ios-tests:
    needs: run-android-tests 
    runs-on: macos-latest
    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 3. Install NPM Dependencies
        run: npm install

      - name: 4. Set timezone to Asia/Kolkata
        run: |
          export TZ=Asia/Kolkata
          echo "TZ=Asia/Kolkata" >> $GITHUB_ENV
          echo "Current time: $(date '+%Y-%m-%d %H:%M:%S')"

      - name: 5. Unzip Demo App
        run: unzip ./ios/TheApp.app.zip -d ./ios/

      # - name: 6. Run WDIO Tests
      #   run: npx wdio run ./wdio.ios.conf.js
      #   continue-on-error: true

      - name: 7. Upload iOS Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-ios
          path: allure-results-ios
          retention-days: 1

  #--------------------------------------
  # JOB 3: GENERATE REPORTS AND TRIGGER CODEBUILD
  #--------------------------------------
  generate-reports-and-trigger-codebuild:
    needs: [run-android-tests, run-ios-tests]
    if: always() 
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Download Android Artifacts
        uses: actions/download-artifact@v4
        with:
          name: allure-results-android
          path: ./allure-results-android
        continue-on-error: true

      - name: 3. Download iOS Artifacts
        uses: actions/download-artifact@v4
        with:
          name: allure-results-ios
          path: ./allure-results-ios
        continue-on-error: true

      - name: 4. Install Allure
        run: npm install -g allure-commandline

      - name: 5. Generate Timestamp
        id: timestamp
        run: |
          export TZ=Asia/Kolkata
          TIMESTAMP=$(date '+%Y-%m-%d-%H-%M-%S')
          echo "TIMESTAMP=$TIMESTAMP" >> $GITHUB_ENV
          echo "timestamp=$TIMESTAMP" >> $GITHUB_OUTPUT
          echo "Generated timestamp: $TIMESTAMP"

      - name: 6. Generate Android Allure Report
        if: hashFiles('./allure-results-android/**/*') != ''
        run: |
          mkdir -p ./allure-report-android
          allure generate ./allure-results-android --clean -o ./allure-report-android
          
          # Save Android test stats
          if [ -f "./allure-report-android/widgets/summary.json" ]; then
            echo "ANDROID_TOTAL=$(jq -r '.statistic.total' ./allure-report-android/widgets/summary.json)" >> $GITHUB_ENV
            echo "ANDROID_PASSED=$(jq -r '.statistic.passed' ./allure-report-android/widgets/summary.json)" >> $GITHUB_ENV
            echo "ANDROID_FAILED=$(jq -r '.statistic.failed' ./allure-report-android/widgets/summary.json)" >> $GITHUB_ENV
            echo "ANDROID_SKIPPED=$(jq -r '.statistic.skipped' ./allure-report-android/widgets/summary.json)" >> $GITHUB_ENV
          else
            echo "ANDROID_TOTAL=0" >> $GITHUB_ENV
            echo "ANDROID_PASSED=0" >> $GITHUB_ENV
            echo "ANDROID_FAILED=0" >> $GITHUB_ENV
            echo "ANDROID_SKIPPED=0" >> $GITHUB_ENV
          fi

      - name: 7. Generate iOS Allure Report
        if: hashFiles('./allure-results-ios/**/*') != ''
        run: |
          mkdir -p ./allure-report-ios
          allure generate ./allure-results-ios --clean -o ./allure-report-ios
          
          # Save iOS test stats
          if [ -f "./allure-report-ios/widgets/summary.json" ]; then
            echo "IOS_TOTAL=$(jq -r '.statistic.total' ./allure-report-ios/widgets/summary.json)" >> $GITHUB_ENV
            echo "IOS_PASSED=$(jq -r '.statistic.passed' ./allure-report-ios/widgets/summary.json)" >> $GITHUB_ENV
            echo "IOS_FAILED=$(jq -r '.statistic.failed' ./allure-report-ios/widgets/summary.json)" >> $GITHUB_ENV
            echo "IOS_SKIPPED=$(jq -r '.statistic.skipped' ./allure-report-ios/widgets/summary.json)" >> $GITHUB_ENV
          else
            echo "IOS_TOTAL=0" >> $GITHUB_ENV
            echo "IOS_PASSED=0" >> $GITHUB_ENV
            echo "IOS_FAILED=0" >> $GITHUB_ENV
            echo "IOS_SKIPPED=0" >> $GITHUB_ENV
          fi

      - name: 8. Create metadata file
        run: |
          cat > metadata.json <<EOF
          {
            "timestamp": "${{ env.TIMESTAMP }}",
            "environment": "${{ env.ENVIRONMENT }}",
            "branch": "${{ github.ref_name }}",
            "commit": "${{ github.sha }}",
            "triggered_by": "${{ github.actor }}",
            "run_id": "${{ github.run_id }}",
            "android": {
              "total": "${{ env.ANDROID_TOTAL }}",
              "passed": "${{ env.ANDROID_PASSED }}",
              "failed": "${{ env.ANDROID_FAILED }}",
              "skipped": "${{ env.ANDROID_SKIPPED }}"
            },
            "ios": {
              "total": "${{ env.IOS_TOTAL }}",
              "passed": "${{ env.IOS_PASSED }}",
              "failed": "${{ env.IOS_FAILED }}",
              "skipped": "${{ env.IOS_SKIPPED }}"
            }
          }
          EOF
          
          echo "Metadata created:"
          cat metadata.json

      - name: 9. Commit and push reports to repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Use GitHub token for authentication
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          
          # Create reports branch if it doesn't exist
          git fetch origin reports-staging || true
          git checkout -b reports-staging || git checkout reports-staging
          
          # Pull latest changes to avoid conflicts
          git pull origin reports-staging --rebase || true
          
          # Create directory structure
          mkdir -p reports/${{ env.TIMESTAMP }}
          
          # Move reports and metadata
          if [ -d "./allure-report-android" ]; then
            cp -r ./allure-report-android reports/${{ env.TIMESTAMP }}/android
            echo "✅ Android reports copied"
          fi
          
          if [ -d "./allure-report-ios" ]; then
            cp -r ./allure-report-ios reports/${{ env.TIMESTAMP }}/ios
            echo "✅ iOS reports copied"
          fi
          
          cp metadata.json reports/${{ env.TIMESTAMP }}/
          echo "✅ Metadata copied"
          
          # Commit and push
          git add reports/${{ env.TIMESTAMP }}
          git commit -m "Add test reports for ${{ env.TIMESTAMP }} [skip ci]" || echo "No changes to commit"
          git push origin reports-staging
          
          echo "✅ Reports pushed to reports-staging branch"

      - name: 10. Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_CODEBUILD_REGION || 'eu-central-1' }}

      - name: 11. Trigger CodeBuild for S3 Deployment
        uses: Verto-FX/aws-codebuild-run-build@1c1c04c8ab8ef96c9bcf92b02939c768f85d6877
        with:
          project-name: frank-test-suite
          env-vars-for-codebuild: |
            TIMESTAMP,
            ENV,
            GITHUB_REPOSITORY,
            ANDROID_TOTAL,
            ANDROID_PASSED,
            ANDROID_FAILED,
            ANDROID_SKIPPED,
            IOS_TOTAL,
            IOS_PASSED,
            IOS_FAILED,
            IOS_SKIPPED,
            GITHUB_ACTOR,
            GITHUB_REF_NAME
        env:
          TIMESTAMP: ${{ env.TIMESTAMP }}
          ENV: ${{ env.ENVIRONMENT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ANDROID_TOTAL: ${{ env.ANDROID_TOTAL }}
          ANDROID_PASSED: ${{ env.ANDROID_PASSED }}
          ANDROID_FAILED: ${{ env.ANDROID_FAILED }}
          ANDROID_SKIPPED: ${{ env.ANDROID_SKIPPED }}
          IOS_TOTAL: ${{ env.IOS_TOTAL }}
          IOS_PASSED: ${{ env.IOS_PASSED }}
          IOS_FAILED: ${{ env.IOS_FAILED }}
          IOS_SKIPPED: ${{ env.IOS_SKIPPED }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_REF_NAME: ${{ github.ref_name }}

      - name: 12. Summary
        if: always()
        run: |
          echo "## 📱 Mobile Test Execution Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Test Results Generated" >> $GITHUB_STEP_SUMMARY
          echo "- **Timestamp**: ${{ env.TIMESTAMP }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment**: ${{ env.ENVIRONMENT }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🤖 Android Results" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Passed: ${{ env.ANDROID_PASSED }}" >> $GITHUB_STEP_SUMMARY
          echo "- ❌ Failed: ${{ env.ANDROID_FAILED }}" >> $GITHUB_STEP_SUMMARY
          echo "- ⏭️ Skipped: ${{ env.ANDROID_SKIPPED }}" >> $GITHUB_STEP_SUMMARY
          echo "- 📊 Total: ${{ env.ANDROID_TOTAL }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🍎 iOS Results" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Passed: ${{ env.IOS_PASSED }}" >> $GITHUB_STEP_SUMMARY
          echo "- ❌ Failed: ${{ env.IOS_FAILED }}" >> $GITHUB_STEP_SUMMARY
          echo "- ⏭️ Skipped: ${{ env.IOS_SKIPPED }}" >> $GITHUB_STEP_SUMMARY
          echo "- 📊 Total: ${{ env.IOS_TOTAL }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📦 Reports committed to \`reports-staging\` branch" >> $GITHUB_STEP_SUMMARY
          echo "🚀 CodeBuild deployment triggered for S3 upload and Slack notification" >> $GITHUB_STEP_SUMMARY