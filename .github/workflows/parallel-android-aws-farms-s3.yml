name: Parallel Device Farm CI

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment'
        required: true
        default: 'uat'
        type: choice
        options: [ "uat", "staging", "prod" ]
  push:
    branches: [ paralleltdddestrail ] # Or your target branch

env:
  # === 1. SET YOUR AWS/S3 VARIABLES ===
  AWS_REGION: "eu-central-1" # Match your Device Farm ARNs
  CODEBUILD_PROJECT_NAME: 'device-farm-runner' # Your CodeBuild project name
  S3_BUCKET_NAME: 'test-reports.vertofx.dev' # Your S3 bucket
  SLACK_SECRET_NAME: 'appium-automation-secrets'

permissions:
  id-token: write
  contents: read

jobs:
  # === Job 1: Discover suites and get a timestamp ===
  discover-suites:
    name: Discover Test Suites
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      timestamp: ${{ steps.set-timestamp.outputs.timestamp }}
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with: 
          node-version: '20'
        
      - name: Generate timestamp
        id: set-timestamp
        run: |
          TIMESTAMP=$(date '+%Y-%m-%d-%H-%M-%S')
          echo "timestamp=${TIMESTAMP}" >> $GITHUB_OUTPUT
          
      - name: Discover test suites
        id: set-matrix
        run: |
          # Use your real discovery script
          MATRIX=$(node scripts/discover-test-suites.js matrix)
          # MATRIX='{"include":[{"suite":{"name":"login"}},{"suite":{"name":"transaction"}}]}'
          echo "matrix=${MATRIX}" >> $GITHUB_OUTPUT

  # === Job 2: Trigger per-suite runs in parallel ===
  trigger-device-farm-runs:
    name: Trigger Run for ${{ matrix.suite.name }}
    runs-on: ubuntu-latest
    needs: discover-suites
    # === ADDED: Output the build_id ===
    outputs:
      build_id: ${{ steps.codebuild.outputs.build_id }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover-suites.outputs.matrix) }}
      
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_NON_PROD_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_NON_PROD_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Trigger CodeBuild for ${{ matrix.suite.name }}
        # === ADDED: id: codebuild ===
        id: codebuild
        run: |
          SUITE_NAME="${{ matrix.suite.name }}"
          SUITE_PATH="./tests/${SUITE_NAME}/**/*.js"

          ENV_VARS=$(cat <<EOF
          [
            {"name":"TIMESTAMP", "value":"${{ needs.discover-suites.outputs.timestamp }}", "type":"PLAINTEXT"},
            {"name":"ENV", "value":"${{ github.event.inputs.environment || 'uat' }}", "type":"PLAINTEXT"},
            {"name":"GITHUB_SHA", "value":"${{ github.sha }}", "type":"PLAINTEXT"},
            {"name":"BUCKET_NAME", "value":"${{ env.S3_BUCKET_NAME }}", "type":"PLAINTEXT"},
            {"name":"TEST_SUITE_NAME", "value":"${SUITE_NAME}", "type":"PLAINTEXT"},
            {"name":"TEST_SUITE_PATH", "value":"${SUITE_PATH}", "type":"PLAINTEXT"}
          ]
          EOF
          )

          # === MODIFIED: Added --query and output ===
          BUILD_ID=$(aws codebuild start-build \
            --project-name ${{ env.CODEBUILD_PROJECT_NAME }} \
            --environment-variables-override "$ENV_VARS" \
            --source-version ${{ github.sha }} \
            --region ${{ env.AWS_REGION }} \
            --query 'build.id' \
            --output text)
            
          echo "Started CodeBuild with ID: $BUILD_ID"
          echo "build_id=${BUILD_ID}" >> $GITHUB_OUTPUT

  # === Job 3: Trigger one final run for aggregation and notification ===
  aggregate-results:
    name: Aggregate & Notify
    runs-on: ubuntu-latest
    needs: [discover-suites, trigger-device-farm-runs]
    if: always() # Always run this, even if suites fail
      
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_NON_PROD_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_NON_PROD_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Trigger CodeBuild for Aggregation
        run: |
          # === FIX: Changed toPrettyJson to toJson ===
          BUILD_ID_JSON='${{ toJson(needs.trigger-device-farm-runs.outputs) }}'
          echo "Raw build ID JSON from matrix: $BUILD_ID_JSON"
          
          # This command parses the JSON, gets all values, and joins them with a comma
          BUILD_IDS=$(echo "$BUILD_ID_JSON" | jq -r '.[].build_id' | tr '\n' ',' | sed 's/,$//')
          echo "Passing BUILD_IDS to aggregator: $BUILD_IDS"

          ENV_VARS=$(cat <<EOF
          [
            {"name":"TIMESTAMP", "value":"${{ needs.discover-suites.outputs.timestamp }}", "type":"PLAINTEXT"},
            {"name":"ENV", "value":"${{ github.event.inputs.environment || 'uat' }}", "type":"PLAINTEXT"},
            {"name":"GITHUB_SHA", "value":"${{ github.sha }}", "type":"PLAINTEXT"},
            {"name":"BUCKET_NAME", "value":"${{ env.S3_BUCKET_NAME }}", "type":"PLAINTEXT"},
            {"name":"SLACK_SECRET_NAME", "value":"${{ env.SLACK_SECRET_NAME }}:slackappurl", "type":"PLAINTEXT"},
            {"name":"CLOUDFRONT_ID", "value":"E133KGF05VOOTU", "type":"PLAINTEXT"},
            {"name":"CLOUDFRONT_URL", "value":"https://test-reports.vertofx.dev", "type":"PLAINTEXT"},
            {"name":"GITHUB_ACTOR", "value":"${{ github.actor }}", "type":"PLAINTEXT"},
            {"name":"GITHUB_REF_NAME", "value":"${{ github.ref_name }}", "type":"PLAINTEXT"},
            {"name":"BUILD_IDS", "value":"${BUILD_IDS}", "type":"PLAINTEXT"}
          ]
          EOF
          )

          aws codebuild start-build \
            --project-name ${{ env.CODEBUILD_PROJECT_NAME }} \
            --environment-variables-override "$ENV_VARS" \
            --source-version ${{ github.sha }} \
            --region ${{ env.AWS_REGION }}