name: Combined Mobile CI (Android & iOS)



on:
  push:
    branches: [ ios_android_test ] 
  pull_request:
    branches: [ ios_android_test ] 
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to run tests against'
        required: true
        default: 'uat'
        type: choice
        options:
          - uat
          - prod

env:
  ENVIRONMENT: ${{ github.event.inputs.environment || 'uat' }}
  CLOUDFRONT_URL: "https://test-reports.vertofx.dev"
  S3_BUCKET_NAME: "appium-reports-verto"

permissions:
  contents: read
  # id-token: write # Required for AWS OIDC authentication

jobs:
  #--------------------------------------
  # JOB 1: RUN ANDROID TESTS
  #--------------------------------------
  run-android-tests:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: 2. Set up JDK 24
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '24'

      - name: 3. Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 4. Install dependencies
        run: npm install

      - name: 5. Set timezone to Asia/Kolkata
        run: |
          export TZ=Asia/Kolkata
          echo "TZ=Asia/Kolkata" >> $GITHUB_ENV
          echo "Current time: $(date '+%Y-%m-%d %H:%M:%S')"

      # - name: 6. Run WebDriverIO tests with emulator
      #   uses: reactivecircus/android-emulator-runner@v2
      #   with:
      #     api-level: 29
      #     script: |
      #       adb install apk/verto.apk
      #       echo "Starting Android tests..."
      #       npx wdio run ./wdio.conf.js
      #   continue-on-error: true

      - name: 6. Upload Android Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-android
          path: allure-results-android
          retention-days: 1

  #--------------------------------------
  # JOB 2: RUN IOS TESTS
  #--------------------------------------
  run-ios-tests:
    needs: run-android-tests 
    runs-on: macos-latest
    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 3. Install NPM Dependencies
        run: npm install

      - name: 4. Set timezone to Asia/Kolkata
        run: |
          export TZ=Asia/Kolkata
          echo "TZ=Asia/Kolkata" >> $GITHUB_ENV
          echo "Current time: $(date '+%Y-%m-%d %H:%M:%S')"

      - name: 5. Unzip Demo App
        run: unzip ./ios/TheApp.app.zip -d ./ios/

      # - name: 6. Run WDIO Tests
      #   run: npx wdio run ./wdio.ios.conf.js
      #   continue-on-error: true

      - name: 6. Upload iOS Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-ios
          path: allure-results-ios
          retention-days: 1

  #--------------------------------------
  # JOB 3: DEPLOY TO S3 AND NOTIFY
  #--------------------------------------
  deploy-to-s3:
    needs: [run-android-tests, run-ios-tests]
    if: always() 
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Download Android Artifacts
        uses: actions/download-artifact@v4
        with:
          name: allure-results-android
          path: ./allure-results-android
        continue-on-error: true

      - name: 3. Download iOS Artifacts
        uses: actions/download-artifact@v4
        with:
          name: allure-results-ios
          path: ./allure-results-ios
        continue-on-error: true

      - name: 4. Install Allure
        run: npm install -g allure-commandline

      - name: 5. Generate Timestamp
        id: timestamp
        run: |
          export TZ=Asia/Kolkata
          TIMESTAMP=$(date '+%Y-%m-%d-%H-%M-%S')
          echo "TIMESTAMP=$TIMESTAMP" >> $GITHUB_ENV
          echo "timestamp=$TIMESTAMP" >> $GITHUB_OUTPUT
          echo "Generated timestamp: $TIMESTAMP"

      - name: 6. Generate Android Allure Report
        if: hashFiles('./allure-results-android/**/*') != ''
        run: |
          mkdir -p ./allure-report-android
          npm run allure:report:android:custom
          
          # Save Android test stats
          if [ -f "./allure-report-android/widgets/summary.json" ]; then
            echo "ANDROID_TOTAL=$(jq -r '.statistic.total' ./allure-report-android/widgets/summary.json)" >> $GITHUB_ENV
            echo "ANDROID_PASSED=$(jq -r '.statistic.passed' ./allure-report-android/widgets/summary.json)" >> $GITHUB_ENV
            echo "ANDROID_FAILED=$(jq -r '.statistic.failed' ./allure-report-android/widgets/summary.json)" >> $GITHUB_ENV
            echo "ANDROID_SKIPPED=$(jq -r '.statistic.skipped' ./allure-report-android/widgets/summary.json)" >> $GITHUB_ENV
          else
            echo "ANDROID_TOTAL=0" >> $GITHUB_ENV
            echo "ANDROID_PASSED=0" >> $GITHUB_ENV
            echo "ANDROID_FAILED=0" >> $GITHUB_ENV
            echo "ANDROID_SKIPPED=0" >> $GITHUB_ENV
          fi

      - name: 7. Generate iOS Allure Report
        if: hashFiles('./allure-results-ios/**/*') != ''
        run: |
          mkdir -p ./allure-report-ios
          npm run allure:report:ios:custom
          
          # Save iOS test stats
          if [ -f "./allure-report-ios/widgets/summary.json" ]; then
            echo "IOS_TOTAL=$(jq -r '.statistic.total' ./allure-report-ios/widgets/summary.json)" >> $GITHUB_ENV
            echo "IOS_PASSED=$(jq -r '.statistic.passed' ./allure-report-ios/widgets/summary.json)" >> $GITHUB_ENV
            echo "IOS_FAILED=$(jq -r '.statistic.failed' ./allure-report-ios/widgets/summary.json)" >> $GITHUB_ENV
            echo "IOS_SKIPPED=$(jq -r '.statistic.skipped' ./allure-report-ios/widgets/summary.json)" >> $GITHUB_ENV
          else
            echo "IOS_TOTAL=0" >> $GITHUB_ENV
            echo "IOS_PASSED=0" >> $GITHUB_ENV
            echo "IOS_FAILED=0" >> $GITHUB_ENV
            echo "IOS_SKIPPED=0" >> $GITHUB_ENV
          fi

      - name: 8. Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'eu-central-1' }}

      # - name: 9. Get S3 Bucket Name from Secrets Manager
      #   run: |
      #     BUCKET_NAME=$(aws secretsmanager get-secret-value \
      #       --secret-id api-testing-stack-secrets \
      #       --query SecretString \
      #       --output text | jq -r '.s3BucketName')
      #     echo "S3_BUCKET_NAME=$BUCKET_NAME" >> $GITHUB_ENV
      #     echo "Retrieved S3 bucket name: $BUCKET_NAME"

      - name: 10. Upload Android Report to S3
        if: hashFiles('./allure-report-android/**/*') != ''
        run: |
          S3_PATH="s3://${{ env.S3_BUCKET_NAME }}/mobile-test-reports/${{ env.ENVIRONMENT }}/${{ env.TIMESTAMP }}/android/"
          aws s3 cp --recursive ./allure-report-android/ $S3_PATH
          echo "Android report uploaded to: $S3_PATH"
          
          # Also upload to 'latest' directory for easy access
          S3_LATEST_PATH="s3://${{ env.S3_BUCKET_NAME }}/mobile-test-reports/${{ env.ENVIRONMENT }}/latest/android/"
          aws s3 cp --recursive ./allure-report-android/ $S3_LATEST_PATH
          echo "Android report also available at: $S3_LATEST_PATH"
          
          # Set URLs for Slack notification
          CLOUDFRONT_URL="${{ secrets.CLOUDFRONT_URL }}"
          echo "ANDROID_REPORT_URL=${CLOUDFRONT_URL}/mobile-test-reports/${{ env.ENVIRONMENT }}/${{ env.TIMESTAMP }}/android/index.html" >> $GITHUB_ENV
          echo "ANDROID_LATEST_URL=${CLOUDFRONT_URL}/mobile-test-reports/${{ env.ENVIRONMENT }}/latest/android/index.html" >> $GITHUB_ENV

      - name: 11. Upload iOS Report to S3
        if: hashFiles('./allure-report-ios/**/*') != ''
        run: |
          S3_PATH="s3://${{ env.S3_BUCKET_NAME }}/mobile-test-reports/${{ env.ENVIRONMENT }}/${{ env.TIMESTAMP }}/ios/"
          aws s3 cp --recursive ./allure-report-ios/ $S3_PATH
          echo "iOS report uploaded to: $S3_PATH"
          
          # Also upload to 'latest' directory for easy access
          S3_LATEST_PATH="s3://${{ env.S3_BUCKET_NAME }}/mobile-test-reports/${{ env.ENVIRONMENT }}/latest/ios/"
          aws s3 cp --recursive ./allure-report-ios/ $S3_LATEST_PATH
          echo "iOS report also available at: $S3_LATEST_PATH"
          
          # Set URLs for Slack notification
          CLOUDFRONT_URL="${{ secrets.CLOUDFRONT_URL }}"
          echo "IOS_REPORT_URL=${CLOUDFRONT_URL}/mobile-test-reports/${{ env.ENVIRONMENT }}/${{ env.TIMESTAMP }}/ios/index.html" >> $GITHUB_ENV
          echo "IOS_LATEST_URL=${CLOUDFRONT_URL}/mobile-test-reports/${{ env.ENVIRONMENT }}/latest/ios/index.html" >> $GITHUB_ENV

      - name: 12. Invalidate CloudFront Cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/mobile-test-reports/${{ env.ENVIRONMENT }}/*"
          echo "CloudFront cache invalidated for environment: ${{ env.ENVIRONMENT }}"

      - name: 13. Send Slack Notification
        if: always()
        run: |
          # Determine overall status
          ANDROID_STATUS="✅ Passed"
          if [ "${{ env.ANDROID_FAILED }}" != "0" ]; then
            ANDROID_STATUS="❌ Failed"
          fi
          
          IOS_STATUS="✅ Passed"
          if [ "${{ env.IOS_FAILED }}" != "0" ]; then
            IOS_STATUS="❌ Failed"
          fi
          
          # Build Slack message
          SLACK_MESSAGE=$(cat <<EOF
          {
            "blocks": [
              {
                "type": "header",
                "text": {
                  "type": "plain_text",
                  "text": "🚀 Mobile Test Automation Report",
                  "emoji": true
                }
              },
              {
                "type": "section",
                "fields": [
                  {
                    "type": "mrkdwn",
                    "text": "*Environment:*\n\`${{ env.ENVIRONMENT }}\`"
                  },
                  {
                    "type": "mrkdwn",
                    "text": "*Branch:*\n\`${{ github.ref_name }}\`"
                  },
                  {
                    "type": "mrkdwn",
                    "text": "*Timestamp:*\n\`${{ env.TIMESTAMP }}\`"
                  },
                  {
                    "type": "mrkdwn",
                    "text": "*Triggered by:*\n${{ github.actor }}"
                  }
                ]
              },
              {
                "type": "divider"
              },
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "*📱 Android Tests* $ANDROID_STATUS"
                }
              },
              {
                "type": "section",
                "fields": [
                  {
                    "type": "mrkdwn",
                    "text": "✅ *Passed:* ${{ env.ANDROID_PASSED }}"
                  },
                  {
                    "type": "mrkdwn",
                    "text": "❌ *Failed:* ${{ env.ANDROID_FAILED }}"
                  },
                  {
                    "type": "mrkdwn",
                    "text": "⏭️ *Skipped:* ${{ env.ANDROID_SKIPPED }}"
                  },
                  {
                    "type": "mrkdwn",
                    "text": "📊 *Total:* ${{ env.ANDROID_TOTAL }}"
                  }
                ]
              },
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "<${{ env.ANDROID_REPORT_URL }}|📄 View Android Report> | <${{ env.ANDROID_LATEST_URL }}|🔗 Latest>"
                }
              },
              {
                "type": "divider"
              },
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "*📱 iOS Tests* $IOS_STATUS"
                }
              },
              {
                "type": "section",
                "fields": [
                  {
                    "type": "mrkdwn",
                    "text": "✅ *Passed:* ${{ env.IOS_PASSED }}"
                  },
                  {
                    "type": "mrkdwn",
                    "text": "❌ *Failed:* ${{ env.IOS_FAILED }}"
                  },
                  {
                    "type": "mrkdwn",
                    "text": "⏭️ *Skipped:* ${{ env.IOS_SKIPPED }}"
                  },
                  {
                    "type": "mrkdwn",
                    "text": "📊 *Total:* ${{ env.IOS_TOTAL }}"
                  }
                ]
              },
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "<${{ env.IOS_REPORT_URL }}|📄 View iOS Report> | <${{ env.IOS_LATEST_URL }}|🔗 Latest>"
                }
              }
            ]
          }
          EOF
          )
          
          curl -X POST -H 'Content-type: application/json' \
            --data "$SLACK_MESSAGE" \
            ${{ secrets.SLACK_WEBHOOK_URL }}