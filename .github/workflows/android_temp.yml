name: Deploy Agentic Verification Service
permissions:
  contents: read

on:
  push:
    branches:
      - mahyhhhin

  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'growth'
        type: choice
        options:
          - uat
      infrastructure:
        description: 'Infrastructure environment'
        required: true
        default: 'non-prod'
        type: choice
        options:
          - non-prod



jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_NON_PROD_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_NON_PROD_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_CODEBUILD_REGION }}

      - name: Build and Deploy Agentic Service
        uses: Verto-FX/aws-codebuild-run-build@1c1c04c8ab8ef96c9bcf92b02939c768f85d6877
        with:
          project-name: one-build-main
          env-vars-for-codebuild: |
            ENV,
            INFRASTRUCTURE
        env:
          ENV: ${{ github.event.inputs.environment || 'growth' }}
          INFRASTRUCTURE: ${{ github.event.inputs.infrastructure || 'non-prod' }}