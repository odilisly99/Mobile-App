name: Parallel Android Test Suite Execution

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to run tests on'
        required: true
        default: 'uat'
        type: choice
        options:
          - uat
          - staging
          - prod
  push:
    branches:
      - paralleltestrffail
  pull_request:
    branches:
      - paralleltestrrrail

env:
  # We can set the environment from the input
  TEST_ENV: ${{ github.event.inputs.environment || 'uat' }}
  # Define the CodeBuild project to trigger for notifications/upload
  CODEBUILD_PROJECT_NAME: appium-test-suite
  AWS_REGION: eu-central-1 # Or pull from secrets

permissions:
  # === Added write permissions for pushing to the reports branch ===
  contents: write

jobs:
  # Job 1: Discover all test suites (Unchanged)
  discover-suites:
    name: Discover Test Suites
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      timestamp: ${{ steps.set-timestamp.outputs.timestamp }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Generate timestamp
        id: set-timestamp
        run: |
          # Use the format from your old file for consistency
          TIMESTAMP=$(date '+%Y-%m-%d-%H-%M-%S')
          echo "timestamp=${TIMESTAMP}" >> $GITHUB_OUTPUT
          echo "Generated timestamp: ${TIMESTAMP}"

      - name: Discover test suites
        id: set-matrix
        run: |
          # Run discovery script
          MATRIX=$(node scripts/discover-test-suites.js matrix)
          echo "Discovered suites matrix:"
          echo "${MATRIX}" | jq '.'
          
          # Set output for matrix
          echo "matrix=${MATRIX}" >> $GITHUB_OUTPUT
  
  # Job 2: Run test suites on hardware-accelerated Ubuntu runners
  run-test-suites:
    name: Run ${{ matrix.suite.name }}
    runs-on: ubuntu-latest # <-- Use Ubuntu for KVM hardware acceleration
    needs: discover-suites
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover-suites.outputs.matrix) }}
    
    steps:
      - name: Checkout code (with LFS for APK)
        uses: actions/checkout@v4
        with:
          lfs: true # This is critical for pulling your large APK file

      - name: Set up Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node.js dependencies
        run: npm install
      
      - name: Install Appium and drivers
        run: |
          npm install -g appium@latest
          appium driver install uiautomator2 || appium driver update uiautomator2 || true

      # === Grant KVM permissions to the runner user ===
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger
          sudo chmod 666 /dev/kvm
          echo "KVM permissions set."
          ls -al /dev/kvm

      - name: Run Emulator and Appium Tests for ${{ matrix.suite.name }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33 
          target: google_apis
          arch: x86_64
          # === Explicitly enabling acceleration & headless options ===
          emulator-options: -no-snapshot -no-window -noaudio -no-boot-anim -accel on
          
          # === SCRIPT BLOCK FIXED ===
          script: |
            echo "Starting Appium server in background..."
            appium &
          
            # Wait for Appium to be ready
            # You may need to run `npm install -g wait-on` in a previous step
            # wait-on http://127.0.0.1:4723/wd/hub/status -t 30000 # Waits 30s
          
            # Or just use a simple sleep
            sleep 10
            echo "Installing APK..."
            adb install apk/verto.apk

            echo "Waiting for emulator to settle..."
            sleep 10
            
            echo "Setting path and running tests for ${{ matrix.suite.name }}..."
            export TEST_SUITE_PATH="./tests/${{ matrix.suite.name }}/**/*.js" && echo "Test path: $TEST_SUITE_PATH" && npx wdio run ./wdio.suite.conf.js --spec "$TEST_SUITE_PATH"
      
      - name: Upload Allure Results Artifact
        if: always() # Upload results even if tests failed
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.suite.name }}
          path: allure-results-android/
          retention-days: 7

      # === VVV NEW STEPS FOR PER-SUITE REPORTING VVV ===

      - name: Install Per-Suite Reporting Tools
        if: always()
        run: |
          sudo apt-get install -y jq
          npm install -g allure-commandline --save-dev

      - name: Generate Per-Suite Allure Reports
        if: always()
        run: |
          SUITE_NAME="${{ matrix.suite.name }}"
          # Generate multi-file report to get summary.json
          allure generate allure-results-android/ --clean -o allure-report-temp-summary
          # Generate single-file report for upload
          allure generate allure-results-android/ --clean --single-file -o "android-singlefile"

      - name: Parse Per-Suite Report Summary
        id: parse_summary
        if: always() && hashFiles('allure-report-temp-summary/widgets/summary.json') != ''
        run: |
          SUMMARY_FILE="allure-report-temp-summary/widgets/summary.json"
          echo "TOTAL=$(jq -r '.statistic.total' $SUMMARY_FILE)" >> $GITHUB_ENV
          echo "PASSED=$(jq -r '.statistic.passed' $SUMMARY_FILE)" >> $GITHUB_ENV
          echo "FAILED=$(jq -r '.statistic.failed' $SUMMARY_FILE)" >> $GITHUB_ENV
          echo "SKIPPED=$(jq -r '.statistic.skipped' $SUMMARY_FILE)" >> $GITHUB_ENV
      
      - name: Create Per-Suite metadata.json
        if: always()
        run: |
          SUITE_NAME="${{ matrix.suite.name }}"
          cat > metadata.json <<EOF
          {
            "timestamp": "${{ needs.discover-suites.outputs.timestamp }}",
            "environment": "${{ env.TEST_ENV }}",
            "branch": "${{ github.ref_name }}",
            "commit": "${{ github.sha }}",
            "triggered_by": "${{ github.actor }}",
            "run_id": "${{ github.run_id }}",
            "test_suite": "${SUITE_NAME}",
            "android": {
              "total": "${{ env.TOTAL || 0 }}",
              "passed": "${{ env.PASSED || 0 }}",
              "failed": "${{ env.FAILED || 0 }}",
              "skipped": "${{ env.SKIPPED || 0 }}"
            }
          }
          EOF
          echo "Per-suite metadata created:"
          cat metadata.json

      - name: Commit and push Per-Suite report
        if: always()
        run: |
          SUITE_NAME="${{ matrix.suite.name }}"
          # === NEW: Create a unique branch per suite ===
          SUITE_BRANCH="reports-staging-${SUITE_NAME}" 
          
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          
          git checkout --orphan $SUITE_BRANCH
          git rm -rf . 2>/dev/null || true

          mkdir -p reports/${SUITE_NAME}/latest

          # Copy single-file report
          if [ -d "./android-singlefile" ]; then
            cp -r ./android-singlefile/* reports/${SUITE_NAME}/latest/
            echo "✅ Per-suite single-file report copied"
          fi

          cp metadata.json reports/${SUITE_NAME}/latest/
          echo "✅ Per-suite metadata copied"
          
          # Copy buildspec.yml and notification.py from the original branch
          git checkout ${{ github.ref_name }} -- buildspec-original.yml
          git checkout ${{ github.ref_name }} -- notification.py

          git add reports/${SUITE_NAME}/latest
          git add metadata.json
          git add buildspec-original.yml
          git add notification.py
          git commit -m "Per-suite report for $SUITE_NAME @ ${{ needs.discover-suites.outputs.timestamp }} [skip ci]"
          
          git push --force origin $SUITE_BRANCH
          echo "✅ Per-suite report pushed to $SUITE_BRANCH"

      - name: Configure AWS Credentials
        if: always()
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_NON_PROD_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_NON_PROD_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Trigger CodeBuild for Per-Suite Report
        if: always()
        run: |
          SUITE_NAME="${{ matrix.suite.name }}"
          # === NEW: Point to the unique suite branch ===
          SUITE_BRANCH="reports-staging-${SUITE_NAME}"

          echo "🚀 Triggering CodeBuild for per-suite report: $SUITE_NAME"
          
          ENV_VARS=$(cat <<EOF
          [
            {"name":"TIMESTAMP","value":"${{ needs.discover-suites.outputs.timestamp }}","type":"PLAINTEXT"},
            {"name":"ENV","value":"${{ env.TEST_ENV }}","type":"PLAINTEXT"},
            {"name":"TEST_SUITE","value":"${SUITE_NAME}","type":"PLAINTEXT"},
            {"name":"GITHUB_REPOSITORY","value":"${{ github.repository }}","type":"PLAINTEXT"},
            {"name":"ANDROID_TOTAL","value":"${{ env.TOTAL || 0 }}","type":"PLAINTEXT"},
            {"name":"ANDROID_PASSED","value":"${{ env.PASSED || 0 }}","type":"PLAINTEXT"},
            {"name":"ANDROID_FAILED","value":"${{ env.FAILED || 0 }}","type":"PLAINTEXT"},
            {"name":"ANDROID_SKIPPED","value":"${{ env.SKIPPED || 0 }}","type":"PLAINTEXT"},
            {"name":"GITHUB_ACTOR","value":"${{ github.actor }}","type":"PLAINTEXT"},
            {"name":"GITHUB_REF_NAME","value":"${{ github.ref_name }}","type":"PLAINTEXT"}
          ]
          EOF
          )
          
          BUILD_OUTPUT=$(aws codebuild start-build \
            --project-name ${{ env.CODEBUILD_PROJECT_NAME }} \
            --environment-variables-override "$ENV_VARS" \
            --source-version $SUITE_BRANCH \
            --region ${{ env.AWS_REGION }} \
            --output json)
          
          BUILD_ID=$(echo "$BUILD_OUTPUT" | jq -r '.build.id')
          echo "✅ Per-suite CodeBuild started: $BUILD_ID"

  # Job 3: Aggregate results (runs after all test suites complete)
  aggregate-results:
    name: Aggregate Test Results & Generate Report
    runs-on: ubuntu-latest
    needs: [discover-suites, run-test-suites]
    if: always() # Run even if some tests failed
    
    steps:
      # === Checkout code to get buildspec.yml/notification.py ===
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all Allure results
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          path: all-allure-results
          merge-multiple: true 
      
      - name: Set up Node.js (for Allure)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Install Allure Commandline
        run: npm install -g allure-commandline --save-dev

      - name: Generate Combined Allure Report
        run: |
          echo "Generating combined Allure report from all suites..."
          ls -R all-allure-results
          # Generate the full, multi-file report
          allure generate all-allure-results --clean -o combined-allure-report
          # Generate the single-file report
          allure generate all-allure-results --clean --single-file -o "android-singlefile"

      - name: Parse Combined Allure Report Summary
        id: parse_summary
        if: hashFiles('combined-allure-report/widgets/summary.json') != ''
        run: |
          SUMMARY_FILE="combined-allure-report/widgets/summary.json"
          echo "TOTAL=$(jq -r '.statistic.total' $SUMMARY_FILE)" >> $GITHUB_ENV
          echo "PASSED=$(jq -r '.statistic.passed' $SUMMARY_FILE)" >> $GITHUB_ENV
          echo "FAILED=$(jq -r '.statistic.failed' $SUMMARY_FILE)" >> $GITHUB_ENV
          echo "SKIPPED=$(jq -r '.statistic.skipped' $SUMMARY_FILE)" >> $GITHUB_ENV
          echo "Stats parsed: TOTAL=${{ env.TOTAL }}, PASSED=${{ env.PASSED }}, FAILED=${{ env.FAILED }}"
        # Set default values if parsing fails
      - name: Set Default Summary Stats
        if: steps.parse_summary.outcome != 'success'
        run: |
          echo "TOTAL=0" >> $GITHUB_ENV
          echo "PASSED=0" >> $GITHUB_ENV
          echo "FAILED=0" >> $GITHUB_ENV
          echo "SKIPPED=0" >> $GITHUB_ENV
          echo "Stats parsing failed, using defaults."

      - name: Upload Combined Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: combined-allure-report
          path: android-singlefile/
          retention-days: 7

      - name: Create Combined metadata.json
        run: |
          cat > metadata.json <<EOF
          {
            "timestamp": "${{ needs.discover-suites.outputs.timestamp }}",
            "environment": "${{ env.TEST_ENV }}",
            "branch": "${{ github.ref_name }}",
            "commit": "${{ github.sha }}",
            "triggered_by": "${{ github.actor }}",
            "run_id": "${{ github.run_id }}",
            "test_suite": "All",
            "android": {
              "total": "${{ env.TOTAL }}",
              "passed": "${{ env.PASSED }}",
              "failed": "${{ env.FAILED }}",
              "skipped": "${{ env.SKIPPED }}"
            },
            "ios": {
              "total": "0",
              "passed": "0",
              "failed": "0",
              "skipped": "0"
            }
          }
          EOF
          
          echo "Combined metadata created:"
          cat metadata.json

      - name: Commit and push Combined reports to repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          
          git fetch origin reports-staging 2>/dev/null || true
          
          git checkout --orphan reports-staging-temp
          git rm -rf . 2>/dev/null || true
          
          mkdir -p reports/latest
          
          
          if [ -d "./android-singlefile" ]; then
            cp -r ./android-singlefile/* reports/latest/
            echo "✅ Combined Android single-file report copied"
          fi

          cp metadata.json reports/latest/
          echo "✅ Metadata copied"
          
          # Copy buildspec.yml and notification.py from the original branch
          git checkout ${{ github.ref_name }} -- buildspec-original.yml
          echo "✅ buildspec-original.yml copied from source branch"
          git checkout ${{ github.ref_name }} -- notification.py
          echo "✅ notification.py copied from source branch"

          git add reports/latest
          git add metadata.json
          git add buildspec-original.yml
          git add notification.py
          git commit -m "AGGREGATE Test reports for ${{ needs.discover-suites.outputs.timestamp }} [skip ci]"
          
          git branch -D reports-staging 2>/dev/null || true
          git branch -m reports-staging
          git push --force origin reports-staging
          
          echo "✅ Combined reports pushed to reports-staging branch"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_NON_PROD_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_NON_PROD_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Trigger CodeBuild for Combined Reporting
        id: codebuild_trigger
        run: |
          echo "🚀 Triggering CodeBuild project: ${{ env.CODEBUILD_PROJECT_NAME }}"
          
          # Build environment variables JSON, adapted for combined stats
          # Note: TEST_SUITE is NOT passed here, so the buildspec knows it's the aggregate run
          ENV_VARS=$(cat <<EOF
          [
            {"name":"TIMESTAMP","value":"${{ needs.discover-suites.outputs.timestamp }}","type":"PLAINTEXT"},
            {"name":"ENV","value":"${{ env.TEST_ENV }}","type":"PLAINTEXT"},
            {"name":"GITHUB_REPOSITORY","value":"${{ github.repository }}","type":"PLAINTEXT"},
            {"name":"ANDROID_TOTAL","value":"${{ env.TOTAL }}","type":"PLAINTEXT"},
            {"name":"ANDROID_PASSED","value":"${{ env.PASSED }}","type":"PLAINTEXT"},
            {"name":"ANDROID_FAILED","value":"${{ env.FAILED }}","type":"PLAINTEXT"},
            {"name":"ANDROID_SKIPPED","value":"${{ env.SKIPPED }}","type":"PLAINTEXT"},
            {"name":"IOS_TOTAL","value":"0","type":"PLAINTEXT"},
            {"name":"IOS_PASSED","value":"0","type":"PLAINTEXT"},
            {"name":"IOS_FAILED","value":"0","type":"PLAINTEXT"},
            {"name":"IOS_SKIPPED","value":"0","type":"PLAINTEXT"},
            {"name":"GITHUB_ACTOR","value":"${{ github.actor }}","type":"PLAINTEXT"},
            {"name":"GITHUB_REF_NAME","value":"${{ github.ref_name }}","type":"PLAINTEXT"}
          ]
          EOF
          )

          echo "Environment variables prepared:"
          echo "$ENV_VARS" | jq .
          
          # === UPDATED: Added --source-version "reports-staging" ===
          BUILD_OUTPUT=$(aws codebuild start-build \
            --project-name ${{ env.CODEBUILD_PROJECT_NAME }} \
            --environment-variables-override "$ENV_VARS" \
            --region ${{ env.AWS_REGION }} \
            --output json)
          
          BUILD_ID=$(echo "$BUILD_OUTPUT" | jq -r '.build.id')
          echo "✅ CodeBuild started successfully!"
          echo "Build ID: $BUILD_ID"
          echo "build_id=$BUILD_ID" >> $GITHUB_OUTPUT

      - name: Generate Job Summary
        if: always()
        run: |
          BUILD_ID="${{ steps.codebuild_trigger.outputs.build_id }}"
          CONSOLE_URL="https://${{ env.AWS_REGION }}.console.aws.amazon.com/codesuite/codebuild/projects/${{ env.CODEBUILD_PROJECT_NAME }}/build/$BUILD_ID"

          echo "# 📱 Parallel Test Execution Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Test Results Generated" >> $GITHUB_STEP_SUMMARY
          echo "- **Timestamp**: ${{ needs.discover-suites.outputs.timestamp }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment**: ${{ env.TEST_ENV }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🤖 Combined Android Results" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Passed: ${{ env.PASSED }}" >> $GITHUB_STEP_SUMMARY
          echo "- ❌ Failed: ${{ env.FAILED }}" >> $GITHUB_STEP_SUMMARY
          echo "- ⏭️ Skipped: ${{ env.SKIPPED }}" >> $GITHUB_STEP_SUMMARY
          echo "- 📊 Total: ${{ env.TOTAL }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📊 A combined Allure report artifact ('combined-allure-report') is available for download." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🚀 **COMBINED CodeBuild job triggered for S3 upload and notifications.**" >> $GITHUB_STEP_SUMMARY
          echo "🔗 [View COMBINED CodeBuild Job in AWS Console]($CONSOLE_URL)" >> $GITHUB_STEP_SUMMARY

