name: Android - Run Tests and Deploy Report

on:
  push:
    branches: [ androidtest ]
  workflow_dispatch:

permissions:
  contents: write # 'read' permission is sufficient for this workflow


env:
  ALLURE_RESULTS_DIR: allure-results
  ALLURE_REPORT_DIR: allure-report

jobs:
  run-mobile-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up JDK 24
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '24'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      # - name: Cache APK build
      #   id: cacheapk
      #   uses: actions/cache@v4
      #   with:
      #     path: apk/verto.apk
      #     key: ${{ runner.os }}-apk-${{ hashFiles('apk/verto.apk') }}


      - name: Run WebDriverIO tests with emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          script: |
            adb install apk/verto.apk
            echo "Starting Android tests..."
            npm run wdio -- --spec tests/specs/test1.spec.js
        continue-on-error: true # Continue to report step even if tests fail

      - name: 6. Check out gh-pages branch
        if: always() # Run even if tests fail
        uses: actions/checkout@v4
        with:
          ref: gh-pages      # Check out the gh-pages branch
          path: gh-pages-deploy # Into a separate directory
          
      - name: 7. Generate Allure Report
        if: always()
        run: |
          npm install -g allure-commandline
          
          # Create directories if they don't exist
          mkdir -p gh-pages-deploy/allure-results 
          
          # Copy new results into the gh-pages checkout
          # This merges new Android results with all previous results
          cp -r allure-results/* gh-pages-deploy/allure-results/
          
          # Generate the report from the combined results
          allure generate gh-pages-deploy/allure-results --clean -o gh-pages-deploy/allure-report
          
          # Save test stats for Slack message
          echo "TOTAL_TESTS=$(jq -r '.statistic.total' gh-pages-deploy/allure-report/widgets/summary.json)" >> $GITHUB_ENV
          echo "PASSED_TESTS=$(jq -r '.statistic.passed' gh-pages-deploy/allure-report/widgets/summary.json)" >> $GITHUB_ENV
          echo "FAILED_TESTS=$(jq -r '.statistic.failed' gh-pages-deploy/allure-report/widgets/summary.json)" >> $GITHUB_ENV
          echo "SKIPPED_TESTS=$(jq -r '.statistic.skipped' gh-pages-deploy/allure-report/widgets/summary.json)" >> $GITHUB_ENV

      - name: 8. Deploy Combined Report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Deploy the entire gh-pages-deploy directory
          publish_dir: gh-pages-deploy
          publish_branch: gh-pages
          # This is CRITICAL: it keeps old files (like allure-results)
          keep_files: true 

      - name: 9. Notify Slack
        if: always()
        run: |
          # The environment variables are now accessible here
          curl -X POST -H 'Content-type: application/json' \
          --data '{"text":":rocket: Allure Test Report for *Android (main)* deployed!\n\n:white_check_mark: *Passed:* ${{ env.PASSED_TESTS }}\n:x: *Failed:* ${{ env.FAILED_TESTS }}\n:grey_question: *Skipped:* ${{ env.SKIPPED_TESTS }}\n\n:page_with_curl: View Report: https://verto-fx.github.io/appium_script_agent/allure-report"}' \
          ${{ secrets.SLACK_WEBHOOK_URL }}