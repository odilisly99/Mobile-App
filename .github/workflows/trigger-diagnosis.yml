  # Job 3: Aggregate results and generate unified report
  aggregate-results:
    name: Aggregate Test Results & Generate Report
    runs-on: ubuntu-latest
    
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_NON_PROD_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_NON_PROD_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Trigger aggregation CodeBuild
        id: aggregator
        run: |
          ENV="${{ github.event.inputs.environment || 'uat' }}"
          TIMESTAMP="${{ needs.discover-suites.outputs.timestamp }}"
          
          echo "Starting aggregation CodeBuild..."
          
          AGG_BUILD_ID=$(aws codebuild start-build \
            --project-name "${{ env.CODEBUILD_AGGREGATOR_PROJECT }}" \
            --environment-variables-override \
              name=TIMESTAMP,value=${TIMESTAMP},type=PLAINTEXT \
              name=ENV,value=${ENV},type=PLAINTEXT \
              name=S3_BUCKET,value=${{ env.S3_BUCKET }},type=PLAINTEXT \
            --region ${{ env.AWS_REGION }} \
            --query 'build.id' \
            --output text)
          
          # Generate console URL
          CONSOLE_URL="https://${{ env.AWS_REGION }}.console.aws.amazon.com/codesuite/codebuild/projects/${{ env.CODEBUILD_AGGREGATOR_PROJECT }}/build/${AGG_BUILD_ID}"
          echo "🔗 View aggregation build in AWS Console:"
          echo "$CONSOLE_URL"
      


