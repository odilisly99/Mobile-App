name: Daily UAT Environment Test Suite - All Tests

permissions:
  contents: read

on:
  schedule:
    # Runs every day at 10:00 AM IST (4:30 AM UTC)
    - cron: '30 4 * * *'
  workflow_dispatch:
    # Allow manual triggering for testing

jobs:
  run-all-test-suites:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        test_suite:
          - 'payment-links'
          - 'beneficiary'
          - 'cards'
          - 'banking-integration'
          - 'case-management'
          - 'payment-approval'
          - 'user-management'
          - 'KYCR'
          - 'exchange-wallet'
          - 'otc-risk-management'
          - 'pricing'
      fail-fast: false # Continue running other tests even if one fails
      max-parallel: 1   # Limit concurrent jobs to avoid overwhelming the environment
    
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
   
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_CODEBUILD_REGION }}

      - name: Run Test Suite - ${{ matrix.test_suite }}
        uses: Verto-FX/aws-codebuild-run-build@1c1c04c8ab8ef96c9bcf92b02939c768f85d6877
        with:
          project-name: frank-test-suite
          env-vars-for-codebuild: |
            TEST_SUITE, 
            ENV,
            INFRASTRUCTURE,
            cloudfrontID 
        env:
          TEST_SUITE: ${{ matrix.test_suite }}
          ENV: uat
          INFRASTRUCTURE: prod
          cloudfrontID: E133KGF05VOOTU

      - name: Test Suite Summary
        if: always()
        run: |
          echo "## Test Suite: ${{ matrix.test_suite }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment**: UAT" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Timestamp**: $(date)" >> $GITHUB_STEP_SUMMARY
